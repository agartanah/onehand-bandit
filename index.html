<html>
    <head>
        <meta charset="UTF-8">
        <title>SLOTS</title>

        <link rel="stylesheet" href="styles/slots.css">
        <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="content">
            <div class="game-layout">
                <aside class="payout-panel" aria-label="Payouts">
                    <h1>PAYTABLE</h1>
                    <p class="payout-subtitle">MATCH 3</p>
                    <div class="payout-list">
                        <div class="payout-row">
                            <div class="payout-symbols">
                                <img src="assets/img/seven.png" alt="Seven">
                                <img src="assets/img/seven.png" alt="Seven">
                                <img src="assets/img/seven.png" alt="Seven">
                            </div>
                            <strong>21x</strong>
                        </div>
                        <div class="payout-row">
                            <div class="payout-symbols">
                                <img src="assets/img/cherry.png" alt="Cherry">
                                <img src="assets/img/cherry.png" alt="Cherry">
                                <img src="assets/img/cherry.png" alt="Cherry">
                            </div>
                            <strong>7x</strong>
                        </div>
                        <div class="payout-row">
                            <div class="payout-symbols">
                                <img src="assets/img/lemon.png" alt="Lemon">
                                <img src="assets/img/lemon.png" alt="Lemon">
                                <img src="assets/img/lemon.png" alt="Lemon">
                            </div>
                            <strong>3x</strong>
                        </div>
                        <div class="payout-row">
                            <div class="payout-symbols">
                                <img src="assets/img/bar.png" alt="Bar">
                                <img src="assets/img/bar.png" alt="Bar">
                                <img src="assets/img/bar.png" alt="Bar">
                            </div>
                            <strong>2x</strong>
                        </div>
                    </div>
                </aside>

                <div class="slot-machine">
                <p id="state-text" class="state-text">LET'S PLAY!</p>
                <div class="slots">
                    <div class="slot">
                        <img src="assets/img/seven.png" alt="slot">
                    </div>
                    <div class="slot">
                        <img src="assets/img/seven.png" alt="slot">
                    </div>
                    <div class="slot">
                        <img src="assets/img/seven.png" alt="slot">
                    </div>
                </div>
                <div class="body-slots">
                    <div class="bet-spin-container">
                        <div class="bet-container">
                            <label>BET</label>
                            <input id="bet" class="bet" type="number" value="100"/>
                        </div>
                        <button id="button-spin" class="button-spin" onclick="console.log('INLINE CLICK')">
                            SPIN
                        </button>
                    </div>
                    <div class="score-container">
                        <label>SCORE</label>
                        <label id="score">10 000</p>
                    </div>
                </div>
            </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
